<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!--
    Misma geometria que el componente Isotipo. Si cambia uno, cambia este.
    Aqui los colores van fijos: un favicon no ve las variables CSS de la
    pagina, asi que el tema se resuelve con su propio prefers-color-scheme
    para que el pin no se pierda en una pestana oscura.
  -->
  <style>
    .pin { fill: #00694a }
    .hueco { fill: #ffffff }
    @media (prefers-color-scheme: dark) {
      .pin { fill: #2ed9a5 }
      .hueco { fill: #0e1414 }
    }
  </style>
  <path class="pin" d="M60 6 C86 6 106 26 106 52 C106 82 72 106 60 116 C48 106 14 82 14 52 C14 26 34 6 60 6 Z"/>
  <circle class="hueco" cx="60" cy="50" r="26"/>
  <circle class="pin" cx="46" cy="43" r="7.5"/>
  <circle class="pin" cx="60" cy="36" r="7.5"/>
  <circle class="pin" cx="74" cy="43" r="7.5"/>
  <ellipse class="pin" cx="60" cy="60" rx="14" ry="10"/>
</svg>
